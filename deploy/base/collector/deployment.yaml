apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-monitor-collector
  namespace: os-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-monitor-collector
  template:
    metadata:
      labels:
        app: os-monitor-collector
    spec:
      hostAliases:
        - ip: "192.168.77.100"
          hostnames: ["registry.local.cloud"]
      containers:
        - name: collector
          image: registry.local.cloud:5000/os-monitor/collector:latest
          env:
            - name: COLLECTOR_MODE
              value: os
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: os-monitor-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
