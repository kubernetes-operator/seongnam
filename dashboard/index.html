<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS Monitor</title>
  <!-- /ai/seoul 기본 페이지 디자인 차용 (커스텀 CSS, 라이트/다크 테마) -->
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header class="topbar">
  <h1><button type="button" id="home-link" class="home-link">OS Monitor</button></h1>
  <nav id="tabs">
    <button class="tab" data-hash="#dashboard">개요</button>
    <button class="tab" data-hash="#nodes">노드</button>
    <button class="tab" data-hash="#events">이벤트</button>
    <button class="tab" data-hash="#logs">로그</button>
    <button class="tab" data-hash="#predictions">예측</button>
    <button class="tab" data-hash="#reports">리포트</button>
  </nav>
  <div class="topbar-spacer"></div>
  <div class="topbar-tools">
    <select id="cluster-select" class="select-sm"><option>클러스터 로딩 중...</option></select>
    <button id="refresh-btn" class="btn-secondary btn-sm">↻ 새로고침</button>
    <button id="api-key-btn" class="btn-secondary btn-sm">🔑 API Key</button>
  </div>
</header>

<main id="app">
  <div id="main-content"><div class="loading">불러오는 중…</div></div>
</main>

<!-- API Key 모달 -->
<div id="api-key-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="api-key-modal-title">
    <h3 id="api-key-modal-title" class="modal-title">API Key 설정</h3>
    <form id="api-key-form">
      <div class="field">
        <input type="password" id="api-key-input" placeholder="Bearer token" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" id="api-key-cancel" class="btn-secondary btn-sm">취소</button>
        <button type="submit" class="btn-primary btn-sm">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- Chart.js (게이지) — 외부 CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<script>window.API_BASE_URL = ''</script>
<script type="module" src="app.js"></script>
</body>
</html>
