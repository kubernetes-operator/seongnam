# ArgoCD 서브패스(/argocd) 노출용 리버스 프록시
# ArgoCD v3.4.5 는 rootpath 설정 시 자산은 /argocd/ 아래로 정상 서빙하지만
# index.html 의 <base href="/"> 를 재작성하지 않는다. 이 nginx 가 그 한 줄만
# <base href="/argocd/"> 로 sub_filter 재작성하여 서브패스 UI 를 완성한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-proxy-nginx
  namespace: argocd
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }
      server {
        listen 80;
        server_name _;
        location / {
          proxy_pass http://argocd-server.argocd.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          # 웹소켓(실시간 업데이트) 지원
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          # 업스트림 압축 비활성 → sub_filter 가 본문을 재작성할 수 있도록
          proxy_set_header Accept-Encoding   "";
          # ArgoCD 가 재작성하지 않는 base href 만 교정
          sub_filter '<base href="/">' '<base href="/argocd/">';
          sub_filter_once on;
          sub_filter_types text/html;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-proxy
  namespace: argocd
  labels:
    app: argocd-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-proxy
  template:
    metadata:
      labels:
        app: argocd-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: conf
          configMap:
            name: argocd-proxy-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-proxy
  namespace: argocd
spec:
  selector:
    app: argocd-proxy
  ports:
    - port: 80
      targetPort: 80
