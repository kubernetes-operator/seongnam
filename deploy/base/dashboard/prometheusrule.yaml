apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: os-monitor-alerts
  namespace: os-monitor
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: os-monitor.rules
      rules:
        - alert: OSMonitorDashboardDown
          expr: |
            kube_deployment_status_replicas_available{namespace="os-monitor", deployment="os-monitor-dashboard"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OS Monitor 대시보드 가용 파드 없음"
            description: "os-monitor-dashboard Deployment의 사용 가능한 replica가 5분 이상 0입니다."

        - alert: OSMonitorAPIDown
          expr: |
            kube_deployment_status_replicas_available{namespace="os-monitor", deployment="os-monitor-api"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OS Monitor API 가용 파드 없음"
            description: "os-monitor-api Deployment의 사용 가능한 replica가 5분 이상 0입니다. /healthz가 DB 연결까지 검사하므로 DB 장애 시에도 readiness가 떨어져 이 알림이 함께 울립니다. 대시보드가 떠 있어도 데이터 조회가 실패할 수 있습니다."
