<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS Monitor</title>
  <!-- /ai/seoul 기본 페이지 디자인 차용 (커스텀 CSS, 라이트/다크 테마) -->
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header class="topbar">
  <h1><button type="button" id="home-link" class="home-link">OS Monitor</button></h1>
  <nav id="tabs">
    <button class="tab" data-hash="#dashboard">개요</button>
    <button class="tab" data-hash="#nodes">노드</button>
    <button class="tab" data-hash="#events">이벤트</button>
    <button class="tab" data-hash="#logs">로그</button>
    <button class="tab" data-hash="#predictions">예측</button>
    <button class="tab" data-hash="#reports">리포트</button>
    <button class="tab" data-hash="#settings">설정</button>
  </nav>
  <div class="topbar-spacer"></div>
  <div class="topbar-tools">
    <select id="cluster-select" class="select-sm"><option>클러스터 로딩 중...</option></select>
    <button id="refresh-btn" class="btn-secondary btn-sm">↻ 새로고침</button>
    <select id="refresh-interval" class="select-sm" title="자동 새로고침 주기">
      <option value="10000">10초</option>
      <option value="30000">30초</option>
      <option value="60000">1분</option>
      <option value="600000">10분</option>
      <option value="0">새로고침 안함</option>
    </select>
    <span id="current-user" class="muted"></span>
    <button id="logout-btn" class="btn-secondary btn-sm" hidden>로그아웃</button>
  </div>
</header>

<main id="app">
  <div id="main-content"><div class="loading">불러오는 중…</div></div>
</main>

<!-- 로그인 화면 (미인증 시 표시) -->
<div id="login-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <h3 id="login-title" class="modal-title">OS Monitor 로그인</h3>
    <form id="login-form">
      <div class="field">
        <label class="muted">사용자명</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="muted">비밀번호</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="text-critical" style="font-size:13px;min-height:18px"></div>
      <div class="modal-actions">
        <button type="submit" class="btn-primary btn-sm">로그인</button>
      </div>
    </form>
  </div>
</div>

<!-- Chart.js (게이지) — 외부 CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<script>window.API_BASE_URL = ''</script>
<script type="module" src="app.js"></script>
</body>
</html>
