server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — 모든 경로를 index.html 로 fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 프록시 (대시보드 → API 서버)
    location /api/ {
        proxy_pass http://os-monitor-api.os-monitor.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Gateway API 경유 서브패스 (test2.studiobasa.com/osmonitoring)
    location = /osmonitoring {
        return 301 /osmonitoring/;
    }

    location /osmonitoring/api/ {
        proxy_pass http://os-monitor-api.os-monitor.svc.cluster.local:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /osmonitoring/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /osmonitoring/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
}
